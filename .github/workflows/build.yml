name: Build APK

on:
  push:
    branches: [watch-ai]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Один ключ подписи для обоих приложений (Data Layer требует одинаковую подпись).
      # Если секрета KEYSTORE_B64 нет, создаётся временный ключ.
      - name: Prepare keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > watchai.keystore
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore watchai.keystore -alias watchai \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass watchai-temp -keypass watchai-temp -dname "CN=WatchAI"
            echo "KEYSTORE_PASSWORD=watchai-temp" >> "$GITHUB_ENV"
          fi

      # llama-server (llama.cpp) под Android arm64: кладётся в APK как libllamaserver.so
      - name: Build llama-server for Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          TAG=$(gh api repos/ggml-org/llama.cpp/releases/latest -q .tag_name)
          echo "llama.cpp tag: $TAG"
          git clone --depth 1 --branch "$TAG" https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-march=armv8.2-a+dotprod" \
            -DCMAKE_CXX_FLAGS="-march=armv8.2-a+dotprod" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-z,max-page-size=16384" \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_SERVER=ON
          cmake --build /tmp/llama-build --target llama-server -j"$(nproc)"
          mkdir -p phone/src/main/jniLibs/arm64-v8a
          cp /tmp/llama-build/bin/llama-server phone/src/main/jniLibs/arm64-v8a/libllamaserver.so
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" phone/src/main/jniLibs/arm64-v8a/libllamaserver.so
          file phone/src/main/jniLibs/arm64-v8a/libllamaserver.so
          ls -la phone/src/main/jniLibs/arm64-v8a/

      - name: Build APKs
        run: ./gradlew --no-daemon :phone:assembleRelease :wear:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp phone/build/outputs/apk/release/phone-release.apk dist/WatchAI-phone.apk
          cp wear/build/outputs/apk/release/wear-release.apk dist/WatchAI-watch.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: WatchAI-apk
          path: dist/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete watchai-latest --yes --cleanup-tag || true
          gh release create watchai-latest dist/*.apk --target "$GITHUB_SHA" \
            --title "WatchAI (последняя сборка)" \
            --notes "WatchAI-phone.apk — на телефон, WatchAI-watch.apk — на часы. Инструкция в README."
